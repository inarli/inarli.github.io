<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% else %}tr{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | Task Roulette</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<link rel="canonical" href="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
<meta name="theme-color" content="#2A1042">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
<meta property="og:image" content="{{ site.url }}/assets/img/taskroulette-og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/taskroulette-icon-192.png">
<link rel="apple-touch-icon" href="/assets/img/taskroulette-touch-icon.png">
<style>
  /* Task Roulette hukuki sayfalari — palet Models/Task.swift (midnight) */
  :root {
    --plum-deep:#190A2C; --plum:#2A1042; --plum-glow:#4A1D6E;
    --pink:#FF4FA3; --pink-lip:#C2306F; --gold:#FFC53D;
    --ink:#2A1042; --muted:#6E6484; --cream:#FFF6EA; --cream-2:#FFE1E8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-weight:400; color:var(--ink); line-height:1.72;
    background:linear-gradient(170deg,var(--cream) 0%,var(--cream-2) 100%) fixed;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}

  header{background:rgba(255,246,234,.82);backdrop-filter:blur(12px);
         border-bottom:1px solid rgba(42,16,66,.07);position:sticky;top:0;z-index:5}
  .nav{display:flex;align-items:center;gap:10px;padding:13px 0}
  .nav a.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
               font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.02rem}
  .nav img{width:30px;height:30px;border-radius:8px;display:block}
  .nav .back{margin-left:auto;font-size:.86rem;font-weight:700;color:var(--pink-lip);text-decoration:none}
  .nav .back:hover{text-decoration:underline}

  .doc{background:#fff;border:1px solid rgba(42,16,66,.06);border-radius:22px;
       box-shadow:0 2px 16px rgba(42,16,66,.07);padding:44px 44px 40px;margin:40px 0 56px}
  .doc h1{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.5rem,3.4vw,2.05rem);
          line-height:1.2;letter-spacing:-.01em;margin-bottom:6px}
  .doc .updated{font-size:.84rem;color:var(--muted);font-weight:700;margin-bottom:28px}
  .doc p{margin:0 0 15px;font-size:1rem}
  /* Markdown'da basliklar **kalin paragraf** olarak yazilmis; onlari baslik gibi goster */
  .doc p > strong:only-child{
    display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.12rem;
    color:var(--ink);margin:30px 0 2px;line-height:1.35
  }
  .doc p > em:only-child{display:block;font-size:.9rem;color:var(--muted);margin-bottom:10px}
  .doc ul{margin:4px 0 18px 22px}
  .doc li{margin-bottom:7px;font-size:.98rem}
  .doc a{color:var(--pink-lip);text-decoration:underline;text-underline-offset:2px}
  .doc hr{border:0;border-top:1px solid rgba(42,16,66,.1);margin:34px 0 28px}
  .doc strong{font-weight:800}

  footer{padding:0 0 48px;font-size:.85rem;color:var(--muted)}
  .foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center}
  footer a{color:var(--pink-lip);text-decoration:none}
  footer a:hover{text-decoration:underline}

  @media (max-width:640px){
    .doc{padding:28px 22px 26px;border-radius:18px;margin:24px 0 40px}
    .wrap{padding:0 16px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="/taskroulette/">
      <img src="/assets/img/taskroulette-icon-192.png" alt="" width="30" height="30">
      Task Roulette
    </a>
    <a class="back" href="/taskroulette/">&larr; {% if page.lang == 'en' %}Back to the app{% else %}Uygulamaya dön{% endif %}</a>
  </div>
</header>

<main class="wrap">
  <article class="doc">
    <h1>{{ page.title }}</h1>
    {{ content }}
  </article>
</main>

<footer>
  <div class="wrap foot">
    <span>&copy; <span id="y">2026</span> İlkay Narlı</span>
    <span>·</span>
    <a href="/task-roulette-gizlilik/">Gizlilik</a>
    <a href="/task-roulette-kullanim-kosullari/">Kullanım Koşulları</a>
    <span>·</span>
    <a href="/task-roulette-privacy/">Privacy</a>
    <a href="/task-roulette-terms-and-conditions/">Terms</a>
  </div>
</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
